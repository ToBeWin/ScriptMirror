name: script_mirror
description: Local-first teleprompter for selfie video recording.
publish_to: none
# Keep the release code above the earlier local QA builds so a freshly built
# universal APK can upgrade an APK produced with --split-per-abi.
version: 0.1.1+2008

environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  sherpa_onnx: ^1.13.6
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/scriptmirror-logo-v2.png
    - assets/asr/sherpa-onnx-streaming-zipformer-small-ctc-zh-int8-2025-04-01/
